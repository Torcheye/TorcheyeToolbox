<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Shapes Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .controls-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 2rem;
        }

        .canvas-area {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .canvas-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 1rem;
        }

        canvas {
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        .section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .label-with-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-display {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.875rem;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--surface-light);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        input[type="color"] {
            width: 100%;
            height: 50px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            transition: border-color 0.2s;
        }

        input[type="color"]:hover {
            border-color: var(--primary);
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--background);
        }

        .shape-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .shape-btn {
            padding: 0.875rem;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .shape-btn:hover {
            border-color: var(--primary);
            background: var(--background);
        }

        .shape-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .export-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .export-btn {
            background: var(--success);
        }

        .export-btn:hover {
            background: #059669;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .controls-panel {
                position: static;
            }
        }

        .color-preview {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid var(--border);
            vertical-align: middle;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vector Shapes Generator</h1>
            <p class="subtitle">Create and customize simple vector shapes with ease</p>
        </header>

        <div class="main-content">
            <aside class="controls-panel">
                <div class="section">
                    <h2 class="section-title">Shape Type</h2>
                    <div class="shape-selector">
                        <button class="shape-btn active" data-shape="circle">Circle</button>
                        <button class="shape-btn" data-shape="rectangle">Rectangle</button>
                    </div>
                </div>

                <div class="section" id="circle-controls">
                    <h2 class="section-title">Circle Properties</h2>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Radius</label>
                            <span class="value-display" id="radius-value">100</span>
                        </div>
                        <input type="range" id="radius" min="10" max="300" value="100">
                    </div>
                </div>

                <div class="section" id="rectangle-controls" style="display: none;">
                    <h2 class="section-title">Rectangle Properties</h2>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Width</label>
                            <span class="value-display" id="rect-width-value">200</span>
                        </div>
                        <input type="range" id="rect-width" min="20" max="400" value="200">
                    </div>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Height</label>
                            <span class="value-display" id="rect-height-value">150</span>
                        </div>
                        <input type="range" id="rect-height" min="20" max="400" value="150">
                    </div>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Corner Radius</label>
                            <span class="value-display" id="corner-radius-value">0</span>
                        </div>
                        <input type="range" id="corner-radius" min="0" max="100" value="0">
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Fill</h2>
                    <div class="control-group">
                        <label>Fill Color</label>
                        <input type="color" id="fill-color" value="#6366f1">
                    </div>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Fill Opacity</label>
                            <span class="value-display" id="fill-opacity-value">100%</span>
                        </div>
                        <input type="range" id="fill-opacity" min="0" max="100" value="100">
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Stroke</h2>
                    <div class="control-group">
                        <label>Stroke Color</label>
                        <input type="color" id="stroke-color" value="#1e293b">
                    </div>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Stroke Width</label>
                            <span class="value-display" id="stroke-width-value">2</span>
                        </div>
                        <input type="range" id="stroke-width" min="0" max="20" value="2">
                    </div>
                    <div class="control-group">
                        <div class="label-with-value">
                            <label>Stroke Opacity</label>
                            <span class="value-display" id="stroke-opacity-value">100%</span>
                        </div>
                        <input type="range" id="stroke-opacity" min="0" max="100" value="100">
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Canvas Size</h2>
                    <div class="control-group">
                        <label>Width (px)</label>
                        <input type="number" id="canvas-width" min="100" max="2000" value="600">
                    </div>
                    <div class="control-group">
                        <label>Height (px)</label>
                        <input type="number" id="canvas-height" min="100" max="2000" value="600">
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Export</h2>
                    <div class="control-group">
                        <label>Export Resolution Scale</label>
                        <div class="export-section">
                            <button class="shape-btn" data-scale="1">1x</button>
                            <button class="shape-btn active" data-scale="2">2x</button>
                            <button class="shape-btn" data-scale="3">3x</button>
                            <button class="shape-btn" data-scale="4">4x</button>
                        </div>
                    </div>
                    <button class="export-btn" id="export-btn">Download PNG</button>
                </div>
            </aside>

            <main class="canvas-area">
                <div class="canvas-container">
                    <canvas id="canvas" width="600" height="600"></canvas>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Get all elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Shape selectors
        const shapeBtns = document.querySelectorAll('.shape-btn[data-shape]');
        const circleControls = document.getElementById('circle-controls');
        const rectangleControls = document.getElementById('rectangle-controls');

        // Circle controls
        const radiusInput = document.getElementById('radius');
        const radiusValue = document.getElementById('radius-value');

        // Rectangle controls
        const rectWidthInput = document.getElementById('rect-width');
        const rectWidthValue = document.getElementById('rect-width-value');
        const rectHeightInput = document.getElementById('rect-height');
        const rectHeightValue = document.getElementById('rect-height-value');
        const cornerRadiusInput = document.getElementById('corner-radius');
        const cornerRadiusValue = document.getElementById('corner-radius-value');

        // Style controls
        const fillColorInput = document.getElementById('fill-color');
        const fillOpacityInput = document.getElementById('fill-opacity');
        const fillOpacityValue = document.getElementById('fill-opacity-value');
        const strokeColorInput = document.getElementById('stroke-color');
        const strokeWidthInput = document.getElementById('stroke-width');
        const strokeWidthValue = document.getElementById('stroke-width-value');
        const strokeOpacityInput = document.getElementById('stroke-opacity');
        const strokeOpacityValue = document.getElementById('stroke-opacity-value');

        // Canvas controls
        const canvasWidthInput = document.getElementById('canvas-width');
        const canvasHeightInput = document.getElementById('canvas-height');

        // Export controls
        const exportBtn = document.getElementById('export-btn');
        const scaleBtns = document.querySelectorAll('.shape-btn[data-scale]');

        // State
        let currentShape = 'circle';
        let exportScale = 2;

        // Shape switching
        shapeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                shapeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentShape = btn.dataset.shape;

                if (currentShape === 'circle') {
                    circleControls.style.display = 'block';
                    rectangleControls.style.display = 'none';
                } else {
                    circleControls.style.display = 'none';
                    rectangleControls.style.display = 'block';
                }

                drawShape();
            });
        });

        // Export scale selection
        scaleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                scaleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                exportScale = parseInt(btn.dataset.scale);
            });
        });

        // Range input handlers
        radiusInput.addEventListener('input', (e) => {
            radiusValue.textContent = e.target.value;
            drawShape();
        });

        rectWidthInput.addEventListener('input', (e) => {
            rectWidthValue.textContent = e.target.value;
            drawShape();
        });

        rectHeightInput.addEventListener('input', (e) => {
            rectHeightValue.textContent = e.target.value;
            drawShape();
        });

        cornerRadiusInput.addEventListener('input', (e) => {
            cornerRadiusValue.textContent = e.target.value;
            drawShape();
        });

        fillOpacityInput.addEventListener('input', (e) => {
            fillOpacityValue.textContent = e.target.value + '%';
            drawShape();
        });

        strokeWidthInput.addEventListener('input', (e) => {
            strokeWidthValue.textContent = e.target.value;
            drawShape();
        });

        strokeOpacityInput.addEventListener('input', (e) => {
            strokeOpacityValue.textContent = e.target.value + '%';
            drawShape();
        });

        // Color inputs
        fillColorInput.addEventListener('input', drawShape);
        strokeColorInput.addEventListener('input', drawShape);

        // Canvas size handlers
        canvasWidthInput.addEventListener('input', (e) => {
            const width = parseInt(e.target.value);
            if (width >= 100 && width <= 2000) {
                canvas.width = width;
                drawShape();
            }
        });

        canvasHeightInput.addEventListener('input', (e) => {
            const height = parseInt(e.target.value);
            if (height >= 100 && height <= 2000) {
                canvas.height = height;
                drawShape();
            }
        });

        // Drawing function
        function drawShape() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Get colors with opacity
            const fillColor = fillColorInput.value;
            const fillOpacity = fillOpacityInput.value / 100;
            const strokeColor = strokeColorInput.value;
            const strokeOpacity = strokeOpacityInput.value / 100;
            const strokeWidth = parseInt(strokeWidthInput.value);

            // Set styles
            ctx.fillStyle = hexToRGBA(fillColor, fillOpacity);
            ctx.strokeStyle = hexToRGBA(strokeColor, strokeOpacity);
            ctx.lineWidth = strokeWidth;

            // Center position
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw based on current shape
            if (currentShape === 'circle') {
                const radius = parseInt(radiusInput.value);

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                if (strokeWidth > 0) {
                    ctx.stroke();
                }
            } else if (currentShape === 'rectangle') {
                const width = parseInt(rectWidthInput.value);
                const height = parseInt(rectHeightInput.value);
                const cornerRadius = parseInt(cornerRadiusInput.value);
                const x = centerX - width / 2;
                const y = centerY - height / 2;

                if (cornerRadius > 0) {
                    drawRoundedRect(ctx, x, y, width, height, cornerRadius);
                } else {
                    ctx.fillRect(x, y, width, height);
                    if (strokeWidth > 0) {
                        ctx.strokeRect(x, y, width, height);
                    }
                }
            }
        }

        // Helper function to draw rounded rectangle
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            radius = Math.min(radius, width / 2, height / 2);

            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.arcTo(x + width, y, x + width, y + radius, radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
            ctx.lineTo(x + radius, y + height);
            ctx.arcTo(x, y + height, x, y + height - radius, radius);
            ctx.lineTo(x, y + radius);
            ctx.arcTo(x, y, x + radius, y, radius);
            ctx.closePath();

            ctx.fill();
            if (ctx.lineWidth > 0) {
                ctx.stroke();
            }
        }

        // Helper function to convert hex to RGBA
        function hexToRGBA(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Export function
        exportBtn.addEventListener('click', () => {
            // Create a temporary canvas with the export scale
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');

            exportCanvas.width = canvas.width * exportScale;
            exportCanvas.height = canvas.height * exportScale;

            // Scale the context
            exportCtx.scale(exportScale, exportScale);

            // Get colors with opacity
            const fillColor = fillColorInput.value;
            const fillOpacity = fillOpacityInput.value / 100;
            const strokeColor = strokeColorInput.value;
            const strokeOpacity = strokeOpacityInput.value / 100;
            const strokeWidth = parseInt(strokeWidthInput.value);

            // Set styles
            exportCtx.fillStyle = hexToRGBA(fillColor, fillOpacity);
            exportCtx.strokeStyle = hexToRGBA(strokeColor, strokeOpacity);
            exportCtx.lineWidth = strokeWidth;

            // Center position
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw the shape
            if (currentShape === 'circle') {
                const radius = parseInt(radiusInput.value);

                exportCtx.beginPath();
                exportCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                exportCtx.fill();
                if (strokeWidth > 0) {
                    exportCtx.stroke();
                }
            } else if (currentShape === 'rectangle') {
                const width = parseInt(rectWidthInput.value);
                const height = parseInt(rectHeightInput.value);
                const cornerRadius = parseInt(cornerRadiusInput.value);
                const x = centerX - width / 2;
                const y = centerY - height / 2;

                if (cornerRadius > 0) {
                    drawRoundedRect(exportCtx, x, y, width, height, cornerRadius);
                } else {
                    exportCtx.fillRect(x, y, width, height);
                    if (strokeWidth > 0) {
                        exportCtx.strokeRect(x, y, width, height);
                    }
                }
            }

            // Convert to blob and download
            exportCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                link.download = `${currentShape}-${exportScale}x-${timestamp}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        });

        // Initial draw
        drawShape();
    </script>
</body>
</html>
